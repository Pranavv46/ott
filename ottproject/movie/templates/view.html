<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ movie.title }} - MyOTT</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0f0f0f;
            color: white;
        }
        .navbar {
            background-color: #000;
        }
        .details-container {
            background-color: #141414;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .btn-like, .btn-dislike {
            width: 120px;
        }
        .btn-fav, .btn-watchlater {
            margin-right: 10px;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark px-4">
    <a class="navbar-brand fw-bold" href="/home/">MyOTT</a>
</nav>

<!-- MOVIE DETAILS -->
<div class="container mt-4">
    <div class="row">

        <!-- POSTER -->
        <div class="col-md-4">
            {% if movie.poster %}
                <img src="{{ movie.poster.url }}" class="img-fluid rounded" alt="{{ movie.title }}">
            {% else %}
                <img src="/media/images/doom.jpg" class="img-fluid rounded" alt="Poster">
            {% endif %}
        </div>

        <!-- DETAILS -->
        <div class="col-md-8">
            <div class="details-container">

                <h2>{{ movie.title }}</h2>

                <p><strong>Genre:</strong> {{ movie.genre }}</p>
                <p><strong>Release Date:</strong> {{ movie.release_date }}</p>
                <p><strong>Duration:</strong> {{ movie.duration }}</p>

                <p>
                    <strong>Description:</strong><br>
                    {{ movie.description }}
                </p>

                <!-- ACTION BUTTONS -->
                <div class="mt-3">
                    <button class="btn btn-danger btn-fav">Add to Favorites</button>
                    <button class="btn btn-outline-light btn-watchlater">Watch Later</button>
                </div>

                <div class="mt-3">
                    <button class="btn btn-success btn-like">👍 Like</button>
                    <button class="btn btn-warning btn-dislike">👎 Dislike</button>
                </div>

            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
