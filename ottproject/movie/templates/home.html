<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OTT Home</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <style>
        body {
            background-color: #0f0f0f;
            color: white;
        }

        .navbar {
            background-color: #000;
        }

        .hero {
            background: url('https://via.placeholder.com/1500x500') center/cover no-repeat;
            height: 60vh;
            display: flex;
            align-items: center;
            padding: 40px;
        }

        .hero-content {
            max-width: 500px;
        }

        .movie-card img {
            border-radius: 10px;
        }

        .movie-card:hover {
            transform: scale(1.05);
            transition: 0.3s;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark px-4">
    <a class="navbar-brand fw-bold" href="#">MyOTT</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

            <li class="nav-item">
                <a class="nav-link active" href="#">Trending Movies</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="#">TV Shows</a>
            </li>

            <!-- MANAGE DROPDOWN -->
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                    Manage
                </a>
                <ul class="dropdown-menu dropdown-menu-dark">
                    <li>
                        <a class="dropdown-item" href="#">Manage Users</a>
                    </li>
                    <li>
                        <a class="dropdown-item" href="#">Manage Movies</a>
                    </li>
                </ul>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="#">Settings</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="#">Admin</a>
            </li>

        </ul>

        <a href="#" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>


<!-- HERO SECTION -->
<div class="hero">
    <div class="hero-content">
        <h1 class="fw-bold">Featured Movie</h1>
        <p class="text">
            Watch the latest blockbuster movies and web series anytime, anywhere.
        </p>
        <button class="btn btn-danger">Watch Now</button>
    </div>
</div>

<!-- MOVIE SECTION -->
<div class="container mt-5">
    <h4 class="mb-4">Trending Movies</h4>

    <div class="row g-4">
        <div class="col-md-3">
            <div class="movie-card">
                <img src="https://m.media-amazon.com/images/M/MV5BYmEwZDRiODAtY2M2Mi00MWU5LWJhZDAtZGRjNTFiOTAwMzc5XkEyXkFqcGc@._V1_.jpg" class="img-fluid">
                <p class="mt-2 text-center">Movie 1</p>
            </div>
        </div>

        <div class="col-md-3">
            <div class="movie-card">
                <img src="https://m.media-amazon.com/images/M/MV5BZTI2OTg0MzgtOGJlMC00MWU2LTlkMDItYTAwNzhmOGIwOWRmXkEyXkFqcGc@._V1_.jpg" class="img-fluid">
                <p class="mt-2 text-center">Movie 2</p>
            </div>
        </div>

        <div class="col-md-3">
            <div class="movie-card">
                <img src="https://m.media-amazon.com/images/M/MV5BNjBkNDMzYzktZjBjMy00ZmU3LTk0MDEtNzAzNGFjMGE4MDQyXkEyXkFqcGc@._V1_.jpg" class="img-fluid">
                <p class="mt-2 text-center">Movie 3</p>
            </div>
        </div>

        <div class="col-md-3">
            <div class="movie-card">
                <img src="https://m.media-amazon.com/images/M/MV5BMWE2NTAyZjEtOTNlZC00Y2NkLTgxMDEtNGJmNmU4MzJhODU0XkEyXkFqcGc@._V1_.jpg" class="img-fluid">
                <p class="mt-2 text-center">Movie 4</p>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS (for mobile navbar toggle) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
