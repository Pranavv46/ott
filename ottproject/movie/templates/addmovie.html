<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Movie</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <style>
        body {
            background-color: #0f0f0f;
            color: white;
        }

        .navbar {
            background-color: #000;
        }

        .form-container {
            max-width: 700px;
            margin: 60px auto;
            background-color: #141414;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        label {
            margin-top: 15px;
        }

        .form-control,
        .form-select {
            background-color: #1f1f1f;
            color: white;
            border: 1px solid #333;
        }

        .form-control::placeholder {
            color: #aaa;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #1f1f1f;
            color: white;
            border-color: #dc3545;
            box-shadow: none;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark px-4">
    <a class="navbar-brand fw-bold text-danger" href="#">VoID-OTT Admin</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="adminNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

            <li class="nav-item">
                <a class="nav-link " href="/home/">Home</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'trending' %}">Trending</a>
            </li>

            <li class="nav-item">
                 <a class="nav-link active" href="{% url 'addmovie' %}">Add Movie</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'editmovie' %}">Edit Movies</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'reports' %}">Reports</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="#">User History</a>
            </li>
        </ul>

        <a href="/logout/" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>
<!-- ADD MOVIE FORM -->
<div class="form-container">
    <h2 class="mb-4 text-center">Add New Movie</h2>

    <form method="POST" enctype="multipart/form-data">
        <!-- Movie Title -->
        <label>Movie Title</label>
        <input type="text" class="form-control" placeholder="Enter movie title">

        <!-- Description -->
        <label>Description</label>
        <textarea class="form-control" rows="4" placeholder="Movie description"></textarea>

        <!-- Genre -->
        <label>Genre</label>
        <select class="form-select">
            <option selected>Select genre</option>
            <option>Action</option>
            <option>Drama</option>
            <option>Comedy</option>
            <option>Thriller</option>
            <option>Romance</option>
        </select>

        <!-- Release Year -->
        <label>Release Year</label>
        <input type="number" class="form-control" placeholder="2024">

        <!-- Duration -->
        <label>Duration (minutes)</label>
        <input type="number" class="form-control" placeholder="120">

        <!-- Thumbnail -->
        <label>Thumbnail Image</label>
        <input type="file" class="form-control">

        <!-- Video URL -->
        <label>Movie Video URL</label>
        <input type="text" class="form-control" placeholder="https://...">

        <!-- Status -->
        <label>Status</label>
        <select class="form-select">
            <option>Active</option>
            <option>Inactive</option>
        </select>

        <!-- Buttons -->
        <div class="d-flex justify-content-between mt-4">
            <button type="submit" class="btn btn-danger">Add Movie</button>
            <button type="reset" class="btn btn-secondary">Reset</button>
        </div>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
