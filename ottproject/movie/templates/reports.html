<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Reports </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

    <style>
        body {
            background: #0f0f0f;
        }
        .navbar {
            background-color: #000000;
        }
        .card {
            border-radius: 8px;
        }
        h4 {
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark px-4">
    <a class="navbar-brand fw-bold text-danger" href="#">VoID-OTT Admin</a>

    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#adminNavbar">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="adminNavbar">
        <ul class="navbar-nav mr-auto">
            <li class="nav-item">
                <a class="nav-link" href="/home/">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Trending</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'addmovie' %}">Add Movie</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'editmovie' %}">Edit Movies</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="#">Reports</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">User History</a>
            </li>
        </ul>

        <a href="/logout/" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>



<div class="container mt-5">

    <div class="card shadow p-4">
        <h4 class="text-center mb-4">📊 Movie Watch Reports</h4>

        
        <form method="get" class="d-flex justify-content-center mb-4">
            <input type="text" class="form-control mr-2" style="width:400px"
                   placeholder="Search movies...">
            <button class="btn btn-success">Search</button>
        </form>

        
        <div class="table-responsive">
            <table class="table table-hover table-striped text-center">
                <thead class="thead-dark">
                    <tr>
                        <th>Rank</th>
                        <th>Movie ID</th>
                        <th>Movie Title</th>
                        <th>Total Views</th>
                        
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>1</td>
                        <td>MV101</td>
                        <td>RRR</td>
                        <td>52,430</td>
                        
                    </tr>

                    <tr>
                        <td>2</td>
                        <td>MV102</td>
                        <td>Inception</td>
                        <td>41,210</td>
                       
                    </tr>

                    <tr>
                        <td>3</td>
                        <td>MV103</td>
                        <td>Interstellar</td>
                        <td>29,875</td>
                        
                    </tr>

                    <tr>
                        <td>4</td>
                        <td>MV104</td>
                        <td>Frozen II</td>
                        <td>18,400</td>
                        
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
